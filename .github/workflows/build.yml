                  if (screen == 2 && groups.isNotEmpty()) {
                      val bar = vbox()
                      val r = dp(24).toFloat()
                      val gd = GradientDrawable()
                      gd.setColor(th.card)
                      gd.cornerRadii = floatArrayOf(r, r, r, r, 0f, 0f, 0f, 0f)
                      gd.setStroke(dp(1), adj(th.tx, 0.08f))
                      bar.background = gd
                      bar.elevation = dp(10).toFloat()
