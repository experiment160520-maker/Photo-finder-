                      trashBtn = tb
                      bar.addView(tb, LinearLayout.LayoutParams(-1, -2))
                      root.addView(bar, FrameLayout.LayoutParams(-1, -2, Gravity.BOTTOM))
                  }
                  setContentView(root)
                  updSel?.invoke()
                  try {
                      val ctl = window.insetsController
                      if (ctl != null) {
                          val m = WindowInsetsController.APPEARANCE_LIGHT_STATUS_BARS or WindowInsetsController.APPEARANCE_LIGHT_NAVIGATION_BARS
                          ctl.setSystemBarsAppearance(if (th.dark) 0 else m, m)
                      }
                  } catch (e: Throwable) {}
                  s.post { s.scrollTo(0, y) }
                  if (!keep) {
                      for (i in 0 until minOf(col.childCount, 12)) {
                          val v = col.getChildAt(i)
                          v.alpha = 0f
                          v.translationY = dp(18).toFloat()
                          v.animate().alpha(1f).translationY(0f).setStartDelay(i * 45L).setDuration(360).setInterpolator(DecelerateInterpolator()).start()
                      }
                  }
                  startAnim()
              }

