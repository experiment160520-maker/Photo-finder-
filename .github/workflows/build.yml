name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.10.2-bin.zip
          unzip -q gradle-8.10.2-bin.zip -d "$HOME"
          echo "$HOME/gradle-8.10.2/bin" >> "$GITHUB_PATH"
      - name: Install Android platform
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" > /dev/null || true
      - name: Write project files
        run: |
          mkdir -p app/src/main/java/com/dupfinder app/src/main/res/values app/src/main/res/drawable app/src/main/res/mipmap-anydpi-v26
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = 'DupFinder'
          include ':app'
          EOF
          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
              id 'org.jetbrains.kotlin.android' version '2.0.21' apply false
          }
          EOF
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3g
          EOF
          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.dupfinder'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.dupfinder'
                  minSdk 30
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />
              <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
              <application
                  android:allowBackup="false"
                  android:largeHeap="true"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:label="Twinly"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true"
                      android:configChanges="orientation|screenSize|screenLayout|smallestScreenSize|keyboardHidden|uiMode">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          cat > app/src/main/res/values/colors.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_bg">#101522</color>
          </resources>
          EOF
          cat > app/src/main/res/drawable/ic_fg.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#6C9BFF"
                  android:pathData="M37,32 L49,32 Q56,32 56,39 L56,51 Q56,58 49,58 L37,58 Q30,58 30,51 L30,39 Q30,32 37,32 Z" />
              <path
                  android:fillColor="#4CD7B0"
                  android:pathData="M57,50 L69,50 Q76,50 76,57 L76,69 Q76,76 69,76 L57,76 Q50,76 50,69 L50,57 Q50,50 57,50 Z" />
          </vector>
          EOF
          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_bg" />
              <foreground android:drawable="@drawable/ic_fg" />
              <monochrome android:drawable="@drawable/ic_fg" />
          </adaptive-icon>
          EOF
          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_bg" />
              <foreground android:drawable="@drawable/ic_fg" />
              <monochrome android:drawable="@drawable/ic_fg" />
          </adaptive-icon>
          EOF
          cat > app/src/main/java/com/dupfinder/MainActivity.kt <<'EOF'
          package com.dupfinder

          import android.Manifest
          import android.animation.ValueAnimator
          import android.app.Activity
          import android.content.ContentUris
          import android.content.ContentValues
          import android.content.Context
          import android.content.Intent
          import android.database.sqlite.SQLiteDatabase
          import android.database.sqlite.SQLiteOpenHelper
          import android.content.SharedPreferences
          import android.content.pm.PackageManager
          import android.content.res.ColorStateList
          import android.content.res.Configuration
          import android.graphics.*
          import android.graphics.drawable.GradientDrawable
          import android.graphics.drawable.RippleDrawable
          import android.media.MediaMetadataRetriever
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.os.PowerManager
          import android.provider.DocumentsContract
          import android.provider.MediaStore
          import android.provider.OpenableColumns
          import android.util.Size
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.View
          import android.view.animation.DecelerateInterpolator
          import android.view.animation.LinearInterpolator
          import android.view.WindowInsetsController
          import android.view.WindowManager
          import android.widget.*
          import java.security.MessageDigest
          import java.util.concurrent.Executors
          import java.util.concurrent.atomic.AtomicInteger

          class Fp(val a: Long, val d: Long)
          class Item(val uri: Uri, val name: String, val size: Long, var w: Int, var h: Int, val mod: Long, var dur: Long,
                     val video: Boolean, val mime: String, val mediaUri: Uri?) {
              var fp: Fp? = null
              var fr: List<Fp?>? = null
              var sha: String? = null
              var bad = false
          }
          class Group(val type: String, val items: List<Item>, val note: String, val auto: Boolean)
          class Run(val n: Int, val a0: Int, val a1: Int, val b0: Int, val b1: Int)
          class Th(val name: String, bgS: String, cardS: String, txS: String, subS: String, acS: String, val dark: Boolean) {
              val bg = Color.parseColor(bgS)
              val card = Color.parseColor(cardS)
              val tx = Color.parseColor(txS)
              val sub = Color.parseColor(subS)
              val ac = Color.parseColor(acS)
          }

          class Cache(ctx: Context) : SQLiteOpenHelper(ctx, "cache.db", null, 1) {
              override fun onCreate(db: SQLiteDatabase) {
                  db.execSQL("CREATE TABLE fp (k TEXT PRIMARY KEY, a INTEGER, d INTEGER, f INTEGER)")
                  db.execSQL("CREATE TABLE sh (k TEXT PRIMARY KEY, v TEXT)")
                  db.execSQL("CREATE TABLE vf (k TEXT PRIMARY KEY, b BLOB)")
              }
              override fun onUpgrade(db: SQLiteDatabase, o: Int, n: Int) {}
              fun loadFp(): HashMap<String, LongArray> {
                  val m = HashMap<String, LongArray>()
                  val c = readableDatabase.rawQuery("SELECT k,a,d,f FROM fp", null)
                  c.use { while (it.moveToNext()) m[it.getString(0)] = longArrayOf(it.getLong(1), it.getLong(2), it.getLong(3)) }
                  return m
              }
              fun saveFp(m: Map<String, LongArray>) {
                  if (m.isEmpty()) return
                  val db = writableDatabase
                  db.beginTransaction()
                  try {
                      val st = db.compileStatement("INSERT OR REPLACE INTO fp VALUES (?,?,?,?)")
                      for ((k, v) in m) {
                          st.clearBindings()
                          st.bindString(1, k)
                          st.bindLong(2, v[0])
                          st.bindLong(3, v[1])
                          st.bindLong(4, v[2])
                          st.executeInsert()
                      }
                      db.setTransactionSuccessful()
                  } finally {
                      db.endTransaction()
                  }
              }
              fun loadSha(): HashMap<String, String> {
                  val m = HashMap<String, String>()
                  val c = readableDatabase.rawQuery("SELECT k,v FROM sh", null)
                  c.use { while (it.moveToNext()) m[it.getString(0)] = it.getString(1) }
                  return m
              }
              fun saveSha(m: Map<String, String>) {
                  if (m.isEmpty()) return
                  val db = writableDatabase
                  db.beginTransaction()
                  try {
                      val st = db.compileStatement("INSERT OR REPLACE INTO sh VALUES (?,?)")
                      for ((k, v) in m) {
                          st.clearBindings()
                          st.bindString(1, k)
                          st.bindString(2, v)
                          st.executeInsert()
                      }
                      db.setTransactionSuccessful()
                  } finally {
                      db.endTransaction()
                  }
              }
              fun loadVf(k: String): List<Fp?>? {
                  val c = readableDatabase.rawQuery("SELECT b FROM vf WHERE k=?", arrayOf(k))
                  return c.use { cur ->
                      if (!cur.moveToFirst()) return@use null
                      val blob = cur.getBlob(0) ?: return@use null
                      val bb = java.nio.ByteBuffer.wrap(blob)
                      val res = ArrayList<Fp?>()
                      while (bb.remaining() >= 17) {
                          val f = bb.get().toInt()
                          val a = bb.getLong()
                          val d = bb.getLong()
                          res.add(if (f == 1) Fp(a, d) else null)
                      }
                      res
                  }
              }
              fun saveVf(k: String, f: List<Fp?>) {
                  val bb = java.nio.ByteBuffer.allocate(17 * f.size)
                  for (x in f) {
                      if (x == null) {
                          bb.put(0.toByte())
                          bb.putLong(0L)
                          bb.putLong(0L)
                      } else {
                          bb.put(1.toByte())
                          bb.putLong(x.a)
                          bb.putLong(x.d)
                      }
                  }
                  val cv = ContentValues()
                  cv.put("k", k)
                  cv.put("b", bb.array())
                  writableDatabase.insertWithOnConflict("vf", null, cv, SQLiteDatabase.CONFLICT_REPLACE)
              }
              fun clear() {
                  val db = writableDatabase
                  db.execSQL("DELETE FROM fp")
                  db.execSQL("DELETE FROM sh")
                  db.execSQL("DELETE FROM vf")
                  db.execSQL("VACUUM")
              }
          }

          class GA(val g: GradientDrawable, val off: Float, val hero: Boolean)

          class GBar(ctx: Context) : View(ctx) {
              var frac = 0f
              var track = 0
              var c1 = 0
              var c2 = 0
              var phase = 0f
              private val p = Paint(Paint.ANTI_ALIAS_FLAG)
              override fun onDraw(canvas: Canvas) {
                  val h = height.toFloat()
                  val w = width.toFloat()
                  val r = h / 2f
                  p.shader = null
                  p.color = track
                  canvas.drawRoundRect(0f, 0f, w, h, r, r, p)
                  val fw = maxOf(h, w * minOf(1f, maxOf(0f, frac)))
                  val x0 = -w + phase * 2f * w
                  p.shader = LinearGradient(x0, 0f, x0 + w, 0f, c1, c2, Shader.TileMode.MIRROR)
                  canvas.drawRoundRect(0f, 0f, fw, h, r, r, p)
              }
          }

          class MainActivity : Activity() {
              companion object { var hooked = false }
              private lateinit var prefs: SharedPreferences
              private lateinit var th: Th
              private var ac = 0
              private var screen = 0
              @Volatile private var scanning = false
              @Volatile private var cancel = false
              private var msg = ""
              private var pct = 0
              private var pmax = 1
              private var statusTv: TextView? = null
              private var gbar: GBar? = null
              private var trashBtn: TextView? = null
              private val grads = ArrayList<GA>()
              private var anim: ValueAnimator? = null
              private var vis = true
              private var sv: ScrollView? = null
              private var groups: List<Group> = ArrayList()
              private val sel = HashSet<Item>()
              private var updSel: (() -> Unit)? = null
              private var shown = 200
              private var lastInfo = ""
              private var wl: PowerManager.WakeLock? = null
              private val cache: Cache by lazy { Cache(applicationContext) }
              @Volatile private var useCache = true
              private var fpCache = HashMap<String, LongArray>()
              private var shaCache = HashMap<String, String>()
              private val newFp = java.util.concurrent.ConcurrentHashMap<String, LongArray>()
              private val newSha = java.util.concurrent.ConcurrentHashMap<String, String>()
              private val thumbs = Executors.newFixedThreadPool(2)
              private val themes = listOf(
                  Th("Light", "#F4F5F7", "#FFFFFF", "#16181D", "#6B7280", "#3B6CF6", false),
                  Th("Dark", "#0F1115", "#1A1D24", "#ECEFF4", "#9AA3B2", "#6C9BFF", true),
                  Th("AMOLED", "#000000", "#111111", "#FFFFFF", "#9A9A9A", "#4CC38A", true),
                  Th("Ocean", "#08141F", "#0F2335", "#E6F3FF", "#8FB0C9", "#3CC8E8", true),
                  Th("Forest", "#0C1410", "#14221A", "#E8F5EC", "#93AE9C", "#5FD38D", true),
                  Th("Sunset", "#1A0F12", "#2A1A1F", "#FFEEE8", "#C9A0A0", "#FF8A5B", true),
                  Th("Rose", "#FFF5F7", "#FFFFFF", "#2A1A20", "#8A6A74", "#E5457A", false),
                  Th("Midnight", "#0B0A14", "#161426", "#EDEBFF", "#9C97C4", "#9B7BFF", true)
              )

              // ---------- UI helpers ----------
              private fun dp(x: Int): Int = (x * resources.displayMetrics.density).toInt()
              private fun vbox(): LinearLayout { val l = LinearLayout(this); l.orientation = LinearLayout.VERTICAL; return l }
              private fun adj(c: Int, a: Float): Int = Color.argb((255 * a).toInt(), Color.red(c), Color.green(c), Color.blue(c))
              private fun hsv(h: Int): Int = Color.HSVToColor(floatArrayOf(h.toFloat(), 0.62f, if (th.dark) 1f else 0.85f))
              private fun onAc(): Int = if (Color.red(ac) * 0.299 + Color.green(ac) * 0.587 + Color.blue(ac) * 0.114 > 160) Color.BLACK else Color.WHITE
              private fun lp(top: Int): LinearLayout.LayoutParams { val l = LinearLayout.LayoutParams(-1, -2); l.topMargin = dp(top); return l }
              private fun add(p: LinearLayout, v: View, top: Int) { p.addView(v, lp(top)) }
              private fun toast(s: String) { Toast.makeText(this, s, Toast.LENGTH_SHORT).show() }
              private fun bgd(color: Int, r: Int, stroke: Int): GradientDrawable {
                  val g = GradientDrawable()
                  g.setColor(color)
                  g.cornerRadius = dp(r).toFloat()
                  if (stroke != 0) g.setStroke(dp(1), stroke)
                  return g
              }
              private fun txt(s: String, size: Float, color: Int, bold: Boolean): TextView {
                  val t = TextView(this)
                  t.text = s
                  t.textSize = size
                  t.setTextColor(color)
                  if (bold) t.typeface = Typeface.create("sans-serif-medium", Typeface.NORMAL)
                  t.setPadding(0, dp(2), 0, dp(2))
                  return t
              }
              private fun card(parent: LinearLayout): LinearLayout {
                  val c = vbox()
                  c.background = bgd(th.card, 24, adj(th.tx, 0.07f))
                  c.elevation = dp(if (th.dark) 0 else 2).toFloat()
                  c.setPadding(dp(18), dp(16), dp(18), dp(18))
                  parent.addView(c, lp(12))
                  return c
              }
              private fun hsvOf(c: Int): FloatArray {
                  val a = FloatArray(3)
                  Color.colorToHSV(c, a)
                  return a
              }

              private fun hc(h: Float, sa: Float, v: Float): Int =
                  Color.HSVToColor(floatArrayOf(((h % 360f) + 360f) % 360f, minOf(1f, maxOf(0f, sa)), minOf(1f, maxOf(0f, v))))

              private fun paintGrad(ga: GA, ph: Float) {
                  val a = hsvOf(ac)
                  val w = Math.sin((ph + ga.off).toDouble()).toFloat()
                  val w2 = Math.sin((ph + ga.off + 2.1f).toDouble()).toFloat()
                  if (ga.hero) {
                      ga.g.setColors(intArrayOf(hc(a[0] + 26f * w, a[1] + 0.1f, 0.56f), hc(a[0] + 45f + 26f * w2, a[1] + 0.1f, 0.42f), hc(a[0] + 85f + 20f * w, a[1] + 0.1f, 0.5f)))
                  } else {
                      ga.g.setColors(intArrayOf(hc(a[0] + 14f * w, a[1], a[2]), hc(a[0] - 14f * w2, a[1], a[2] * 0.9f)))
                  }
              }

              private fun startAnim() {
                  anim?.cancel()
                  anim = null
                  if (grads.isEmpty() && gbar == null) return
                  val a = ValueAnimator.ofFloat(0f, 6.2831855f)
                  a.duration = 9000
                  a.repeatCount = ValueAnimator.INFINITE
                  a.interpolator = LinearInterpolator()
                  a.addUpdateListener { va ->
                      val ph = va.animatedValue as Float
                      for (ga in grads) paintGrad(ga, ph)
                      val gb = gbar
                      if (gb != null) {
                          gb.phase = ph / 6.2831855f
                          gb.invalidate()
                      }
                  }
                  anim = a
                  a.start()
                  if (!vis) a.pause()
              }

              private fun pill(label: String, filled: Boolean, f: () -> Unit): TextView {
                  val t = TextView(this)
                  t.text = label
                  t.textSize = 15f
                  t.gravity = Gravity.CENTER
                  t.typeface = Typeface.create("sans-serif-medium", Typeface.NORMAL)
                  t.setTextColor(if (filled) onAc() else ac)
                  val b: android.graphics.drawable.Drawable
                  if (filled) {
                      val g = GradientDrawable()
                      g.orientation = GradientDrawable.Orientation.LEFT_RIGHT
                      g.cornerRadius = dp(16).toFloat()
                      val ga = GA(g, grads.size * 0.7f, false)
                      grads.add(ga)
                      paintGrad(ga, 0f)
                      b = g
                  } else {
                      b = bgd(Color.TRANSPARENT, 16, adj(ac, 0.7f))
                  }
                  t.background = RippleDrawable(ColorStateList.valueOf(adj(Color.GRAY, 0.35f)), b, null)
                  t.setPadding(dp(18), dp(13), dp(18), dp(13))
                  t.setOnClickListener { f() }
                  t.setOnTouchListener { v, e ->
                      if (e.action == MotionEvent.ACTION_DOWN) v.animate().scaleX(0.97f).scaleY(0.97f).setDuration(90).start()
                      else if (e.action == MotionEvent.ACTION_UP || e.action == MotionEvent.ACTION_CANCEL) v.animate().scaleX(1f).scaleY(1f).setDuration(140).start()
                      false
                  }
                  return t
              }

              private fun swRow(p: LinearLayout, label: String, key: String, def: Boolean, onChange: (() -> Unit)?) {
                  val r = LinearLayout(this)
                  r.gravity = Gravity.CENTER_VERTICAL
                  r.addView(txt(label, 15f, th.tx, false), LinearLayout.LayoutParams(0, -2, 1f))
                  val s = Switch(this)
                  s.isChecked = prefs.getBoolean(key, def)
                  s.trackTintList = ColorStateList(arrayOf(intArrayOf(android.R.attr.state_checked), intArrayOf()), intArrayOf(ac, adj(th.tx, 0.25f)))
                  s.thumbTintList = ColorStateList.valueOf(Color.WHITE)
                  s.setOnCheckedChangeListener { _, v ->
                      prefs.edit().putBoolean(key, v).apply()
                      if (onChange != null) onChange()
                  }
                  r.addView(s)
                  add(p, r, 6)
              }
              private fun chips(p: LinearLayout, label: String, key: String, names: List<String>, vals: List<Int>, def: Int, after: (() -> Unit)?) {
                  add(p, txt(label, 13f, th.sub, false), 12)
                  val hs = HorizontalScrollView(this)
                  hs.isHorizontalScrollBarEnabled = false
                  val row = LinearLayout(this)
                  hs.addView(row)
                  val views = ArrayList<TextView>()
                  fun paint() {
                      val cur = prefs.getInt(key, def)
                      for (i in views.indices) {
                          val on = vals[i] == cur
                          views[i].setTextColor(if (on) onAc() else th.tx)
                          views[i].background = bgd(if (on) ac else adj(th.tx, 0.08f), 12, 0)
                      }
                  }
                  for (i in names.indices) {
                      val t = TextView(this)
                      t.text = names[i]
                      t.textSize = 14f
                      t.setPadding(dp(14), dp(9), dp(14), dp(9))
                      t.setOnClickListener {
                          prefs.edit().putInt(key, vals[i]).apply()
                          paint()
                          if (after != null) after()
                      }
                      views.add(t)
                      val l = LinearLayout.LayoutParams(-2, -2)
                      l.rightMargin = dp(8)
                      row.addView(t, l)
                  }
                  paint()
                  add(p, hs, 6)
              }
              private fun pickTheme(): Th {
                  val i = prefs.getInt("theme", 0)
                  if (i > 0 && i <= themes.size) return themes[i - 1]
                  val night = (resources.configuration.uiMode and Configuration.UI_MODE_NIGHT_MASK) == Configuration.UI_MODE_NIGHT_YES
                  return if (night) themes[1] else themes[0]
              }

              // ---------- lifecycle ----------
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  prefs = getSharedPreferences("dupe", MODE_PRIVATE)
                  if (!hooked) {
                      hooked = true
                      val old = Thread.getDefaultUncaughtExceptionHandler()
                      Thread.setDefaultUncaughtExceptionHandler { t, e ->
                          try { prefs.edit().putString("crash", android.util.Log.getStackTraceString(e)).commit() } catch (x: Throwable) {}
                          if (old != null) old.uncaughtException(t, e)
                      }
                  }
                  val crash = prefs.getString("crash", null)
                  if (crash != null) { showCrash(crash); return }
                  try { render(false) } catch (e: Throwable) { showCrash(android.util.Log.getStackTraceString(e)) }
              }

              private fun showCrash(trace: String) {
                  prefs.edit().remove("crash").commit()
                  val col = vbox()
                  col.setPadding(dp(16), dp(32), dp(16), dp(16))
                  col.addView(txt("Twinly hit a problem", 20f, Color.BLACK, true))
                  col.addView(txt("Please screenshot this and send it to Claude. Close and reopen the app afterwards.", 14f, Color.DKGRAY, false))
                  val t = TextView(this)
                  t.text = trace.take(1800)
                  t.textSize = 11f
                  t.setTextColor(Color.BLACK)
                  col.addView(t)
                  val sc = ScrollView(this)
                  sc.setBackgroundColor(Color.WHITE)
                  sc.addView(col)
                  setContentView(sc)
              }
              override fun onConfigurationChanged(newConfig: Configuration) {
                  super.onConfigurationChanged(newConfig)
                  if (prefs.getInt("theme", 0) == 0) render(true)
              }
              @Suppress("DEPRECATION")
              override fun onBackPressed() {
                  if (screen != 0) { screen = 0; render(false) } else super.onBackPressed()
              }

              override fun onPause() {
                  super.onPause()
                  vis = false
                  anim?.pause()
              }

              override fun onResume() {
                  super.onResume()
                  vis = true
                  anim?.resume()
              }

              override fun onDestroy() {
                  super.onDestroy()
                  anim?.cancel()
              }

              override fun onRequestPermissionsResult(requestCode: Int, permissions: Array<out String>, grantResults: IntArray) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults)
                  if (requestCode == 7 && grantResults.isNotEmpty() && grantResults.all { it == PackageManager.PERMISSION_GRANTED }) startScan(null)
              }

              private fun render(keep: Boolean) {
                  th = pickTheme()
                  val h = prefs.getInt("hue", -1)
                  ac = if (h < 0) th.ac else hsv(h)
                  window.statusBarColor = th.bg
                  window.navigationBarColor = th.bg
