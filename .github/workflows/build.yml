              private fun smartSelect() {
                  sel.clear()
                  for (g in groups) if (g.auto) {
                      val k = keeper(g.items)
                      for (m in g.items) if (m !== k && m.mediaUri != null) sel.add(m)
                  }
              }

              private fun preview(m: Item) {
                  try {
                      val i = Intent(Intent.ACTION_VIEW)
                      i.setDataAndType(m.uri, if (m.mime.isEmpty()) (if (m.video) "video/*" else "image/*") else m.mime)
                      i.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION)
                      startActivity(i)
                  } catch (e: Throwable) {
                      toast("No app found to open this file")
                  }
              }

              private fun thumb(m: Item): Bitmap? {
                  try { return contentResolver.loadThumbnail(m.uri, Size(240, 240), null) } catch (e: Throwable) {}
                  try {
                      if (m.video) {
                          val mr = MediaMetadataRetriever()
                          try {
                              mr.setDataSource(this, m.uri)
                              return mr.getFrameAtTime(0)
                          } finally {
                              try { mr.release() } catch (e: Throwable) {}
                          }
                      }
                      return ImageDecoder.decodeBitmap(ImageDecoder.createSource(contentResolver, m.uri)) { d, _, _ -> d.setTargetSampleSize(4) }
                  } catch (e: Throwable) {}
                  return null
              }

              private fun mb(b: Long): String = if (b >= 1048576L) String.format("%.1f MB", b / 1048576.0) else String.format("%d KB", b / 1024)

              private fun describe(m: Item): String {
                  val sb = StringBuilder(m.name)
                  sb.append("\n").append(mb(m.size))
                  if (m.w > 0 && m.h > 0) sb.append("  -  ").append(m.w).append("x").append(m.h)
                  if (m.video && m.dur > 0) sb.append("  -  ").append(mmss(m.dur / 1000.0))
                  val t = m.mime.substringAfter("/", "").uppercase()
                  if (t.isNotEmpty()) sb.append("  -  ").append(t)
                  return sb.toString()
              }

              private fun keeper(g: List<Item>): Item {
                  val r = prefs.getInt("keep", 0)
                  var b = g[0]
                  for (m in g) {
                      if (r == 1) {
                          if (b.mod == 0L || (m.mod > 0L && m.mod < b.mod)) b = m
                      } else if (r == 2) {
                          if (m.mod > b.mod) b = m
                      } else {
                          val pm = m.w.toLong() * m.h
                          val pb = b.w.toLong() * b.h
                          if (pm > pb || (pm == pb && m.size > b.size)) b = m
                      }
                  }
                  return b
              }

              // ---------- picking, permissions, trash ----------
              private fun pick() {
                  val i = Intent(Intent.ACTION_OPEN_DOCUMENT)
                  i.addCategory(Intent.CATEGORY_OPENABLE)
                  i.type = "*/*"
                  i.putExtra(Intent.EXTRA_MIME_TYPES, arrayOf("image/*", "video/*"))
                  i.putExtra(Intent.EXTRA_ALLOW_MULTIPLE, true)
                  startActivityForResult(i, 43)
              }

              private fun trashSelected() {
                  val uris = ArrayList<Uri>()
                  for (m in sel) {
                      val u = m.mediaUri
                      if (u != null) uris.add(u)
                  }
                  if (uris.isEmpty()) { toast("Nothing selected"); return }
                  try {
                      val pi = MediaStore.createTrashRequest(contentResolver, uris, true)
                      startIntentSenderForResult(pi.intentSender, 42, null, 0, 0, 0)
                  } catch (e: Throwable) {
                      toast("Android did not allow this. Delete them in your gallery instead.")
                  }
              }

              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode == 43 && resultCode == RESULT_OK && data != null) {
                      val us = ArrayList<Uri>()
                      val cd = data.clipData
                      if (cd != null) {
                          for (i in 0 until cd.itemCount) us.add(cd.getItemAt(i).uri)
                      } else {
                          val d = data.data
                          if (d != null) us.add(d)
                      }
                      if (us.size > 1) startScan(us) else toast("Pick at least 2 files to compare")
                  }
                  if (requestCode == 42) {
                      if (resultCode == RESULT_OK) {
                          val gone = HashSet<Item>()
                          for (m in sel) if (m.mediaUri != null) gone.add(m)
                          val ng = ArrayList<Group>()
                          for (g in groups) {
                              val left = g.items.filter { x -> x !in gone }
                              if (left.size > 1) ng.add(Group(g.type, left, g.note, g.auto))
                          }
                          groups = ng
                          sel.removeAll(gone)
                          msg = "Moved " + gone.size + " items to trash."
                          if (groups.isEmpty()) screen = 0
                          render(false)
                      } else {
                          toast("Cancelled. Nothing was changed.")
                      }
                  }
              }

              private fun perm(): Boolean {
                  val p = if (Build.VERSION.SDK_INT >= 33)
                      arrayOf(Manifest.permission.READ_MEDIA_IMAGES, Manifest.permission.READ_MEDIA_VIDEO)
                  else arrayOf(Manifest.permission.READ_EXTERNAL_STORAGE)
                  if (p.all { checkSelfPermission(it) == PackageManager.PERMISSION_GRANTED }) return true
                  requestPermissions(p, 7)
                  toast("Allow access to all photos and videos, then tap Scan again")
                  return false
              }

              // ---------- scanning ----------
              private fun startScan(picked: List<Uri>?) {
                  if (scanning) return
                  if (picked == null && !perm()) return
                  scanning = true
                  lock(true)
                  shown = 200
                  cancel = false
                  groups = ArrayList()
                  sel.clear()
                  msg = "Starting..."
                  pct = 0
                  pmax = 1
                  window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                  screen = 0
                  render(false)
                  Thread {
                      try {
                          doScan(picked)
                      } catch (e: Throwable) {
                          msg = "Something went wrong: " + e.javaClass.simpleName + " " + (e.message ?: "")
                          groups = ArrayList()
                      }
                      lock(false)
                      scanning = false
                      runOnUiThread {
                          window.clearFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                          screen = if (groups.isNotEmpty()) 2 else 0
                          render(false)
                      }
                  }.start()
              }

              private fun prog(d: Int, t: Int, m: String) {
                  msg = m
                  pct = d
                  pmax = if (t < 1) 1 else t
                  runOnUiThread {
                      statusTv?.text = msg
                      gbar?.frac = pct.toFloat() / pmax
                  }
              }

              private fun <T> par(list: List<T>, cap: Int, fn: (T) -> Unit) {
                  val set = prefs.getInt("thr", 0)
                  val n = maxOf(1, if (set > 0) set else maxOf(2, minOf(cap, Runtime.getRuntime().availableProcessors())))
                  val idx = AtomicInteger(0)
                  val ws = ArrayList<Thread>()
                  for (i in 0 until n) {
                      val t = Thread {
                          android.os.Process.setThreadPriority(android.os.Process.THREAD_PRIORITY_FOREGROUND)
                          while (!cancel) {
                              val k = idx.getAndIncrement()
                              if (k >= list.size) break
                              try { fn(list[k]) } catch (e: Throwable) {}
                          }
                      }
                      ws.add(t)
                      t.start()
                  }
                  for (t in ws) t.join()
              }

              private fun lock(on: Boolean) {
                  try {
                      if (on) {
                          val pm = getSystemService(Context.POWER_SERVICE) as PowerManager
                          val w = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "dupefinder:scan")
                          w.acquire(3 * 60 * 60 * 1000L)
                          wl = w
                      } else {
                          val w = wl
                          if (w != null && w.isHeld) w.release()
                          wl = null
                      }
                  } catch (e: Throwable) {}
              }

              private fun ck(m: Item): String? {
                  val mu = m.mediaUri
                  return if (mu != null && mu == m.uri) m.uri.toString() + "|" + m.size + "|" + m.mod else null
              }

              private fun eta(d: Int, t: Int, t0: Long): String {
                  val el = (System.currentTimeMillis() - t0) / 1000.0
                  if (d < 5 || el < 1.0) return ""
                  val rate = d / el
                  val left = ((t - d) / rate).toInt()
                  val lt = if (left >= 60) (left / 60).toString() + " min " + (left % 60) + " s" else left.toString() + " s"
                  return " - " + rate.toInt() + "/s - about " + lt + " left"
              }

              private fun doScan(picked: List<Uri>?) {
                  val t0 = System.currentTimeMillis()
                  useCache = prefs.getBoolean("cache", true)
                  if (useCache) {
                      try {
                          fpCache = cache.loadFp()
                          shaCache = cache.loadSha()
                      } catch (e: Throwable) {
                          fpCache = HashMap()
                          shaCache = HashMap()
                      }
                  }
                  try {
                      val items = if (picked == null) loadAll() else loadPicked(picked)
                      prog(0, 1, "Found " + items.size + " files")
                      val photos = ArrayList<Item>()
                      val vids = ArrayList<Item>()
                      for (m in items) if (m.video) vids.add(m) else photos.add(m)
                      val out = ArrayList<Group>()
                      if (photos.size > 1) scanPhotos(photos, out)
                      if (!cancel && vids.size > 1) scanVideos(vids, out)
                      if (cancel) { groups = ArrayList(); msg = "Cancelled."; return }
                      val sorted = out.sortedByDescending { g -> saving(g) }
                      groups = sorted
                      sel.clear()
                      smartSelect()
                      val secs = (System.currentTimeMillis() - t0) / 1000.0
                      lastInfo = "Scanned " + items.size + " files in " + String.format("%.1f", secs) + " s"
                      msg = if (sorted.isEmpty()) "Done. No duplicates found. " + lastInfo + "." else ""
                  } finally {
                      if (useCache) {
                          try {
                              cache.saveFp(newFp)
                              cache.saveSha(newSha)
                          } catch (e: Throwable) {}
                      }
                      newFp.clear()
                      newSha.clear()
                      fpCache = HashMap()
                      shaCache = HashMap()
                  }
              }

              private fun query(video: Boolean): List<Item> {
                  val base = if (video) MediaStore.Video.Media.EXTERNAL_CONTENT_URI else MediaStore.Images.Media.EXTERNAL_CONTENT_URI
                  val cols = ArrayList<String>()
                  cols.add(MediaStore.MediaColumns._ID)
                  cols.add(MediaStore.MediaColumns.DISPLAY_NAME)
                  cols.add(MediaStore.MediaColumns.SIZE)
                  cols.add(MediaStore.MediaColumns.WIDTH)
                  cols.add(MediaStore.MediaColumns.HEIGHT)
                  cols.add(MediaStore.MediaColumns.DATE_MODIFIED)
                  cols.add(MediaStore.MediaColumns.MIME_TYPE)
                  if (video) cols.add(MediaStore.MediaColumns.DURATION)
                  val res = ArrayList<Item>()
                  val c = contentResolver.query(base, cols.toTypedArray(), null, null, null)
                  if (c != null) {
                      c.use {
                          while (it.moveToNext()) {
                              val u = ContentUris.withAppendedId(base, it.getLong(0))
                              val dur = if (video) it.getLong(7) else 0L
                              res.add(Item(u, it.getString(1) ?: "?", it.getLong(2), it.getInt(3), it.getInt(4), it.getLong(5), dur, video, it.getString(6) ?: "", u))
                          }
                      }
                  }
                  return res
              }

              private fun loadAll(): List<Item> {
                  val res = ArrayList<Item>()
                  val minB = prefs.getInt("minkb", 0) * 1024L
                  val gif = prefs.getBoolean("gif", true)
                  if (prefs.getBoolean("photos", true)) for (m in query(false)) if (m.size >= minB && (gif || m.mime != "image/gif")) res.add(m)
                  if (prefs.getBoolean("videos", true)) for (m in query(true)) if (m.size >= minB) res.add(m)
                  return res
              }

              private fun toMedia(u: Uri, video: Boolean): Uri? {
                  try {
                      if (u.authority == MediaStore.AUTHORITY) return u
                      if (Build.VERSION.SDK_INT >= 31) {
                          val r = MediaStore.getMediaUri(this, u)
                          if (r != null) return r
                      }
                      if (u.authority == "com.android.providers.media.documents") {
                          val id = DocumentsContract.getDocumentId(u).substringAfter(":").toLong()
                          return ContentUris.withAppendedId(if (video) MediaStore.Video.Media.EXTERNAL_CONTENT_URI else MediaStore.Images.Media.EXTERNAL_CONTENT_URI, id)
                      }
                  } catch (e: Throwable) {}
                  return null
              }

              private fun vidInfo(m: Item) {
                  val mr = MediaMetadataRetriever()
                  try {
                      mr.setDataSource(this, m.uri)
                      m.dur = mr.extractMetadata(MediaMetadataRetriever.METADATA_KEY_DURATION)?.toLongOrNull() ?: 0L
                      m.w = mr.extractMetadata(MediaMetadataRetriever.METADATA_KEY_VIDEO_WIDTH)?.toIntOrNull() ?: 0
                      m.h = mr.extractMetadata(MediaMetadataRetriever.METADATA_KEY_VIDEO_HEIGHT)?.toIntOrNull() ?: 0
                  } catch (e: Throwable) {
                  } finally {
                      try { mr.release() } catch (e: Throwable) {}
                  }
              }

              private fun loadPicked(us: List<Uri>): List<Item> {
                  val res = ArrayList<Item>()
                  var n = 0
                  for (u in us) {
                      var name = "file"
                      var size = 0L
                      try {
                          contentResolver.query(u, arrayOf(OpenableColumns.DISPLAY_NAME, OpenableColumns.SIZE), null, null, null)?.use {
                              if (it.moveToFirst()) {
                                  name = it.getString(0) ?: "file"
                                  size = it.getLong(1)
                              }
                          }
                      } catch (e: Throwable) {}
                      val mime = contentResolver.getType(u) ?: ""
                      val video = mime.startsWith("video/")
                      val m = Item(u, name, size, 0, 0, 0L, 0L, video, mime, toMedia(u, video))
                      if (video) vidInfo(m)
                      res.add(m)
                      n++
                      prog(n, us.size, "Reading picked files... $n/" + us.size)
                  }
                  return res
              }

              private fun sha(u: Uri): String? {
                  try {
                      val md = MessageDigest.getInstance("SHA-256")
                      val buf = ByteArray(1 shl 20)
                      val ins = contentResolver.openInputStream(u) ?: return null
                      ins.use { s ->
                          while (true) {
                              val n = s.read(buf)
                              if (n < 0) break
                              md.update(buf, 0, n)
                          }
                      }
                      return md.digest().joinToString("") { b -> String.format("%02x", b) }
                  } catch (e: Throwable) {
                      return null
                  }
              }

              private fun hashBmp(b0: Bitmap, skipFlat: Boolean): Fp? {
                  val b = if (b0.width == 64 && b0.height == 64) b0 else Bitmap.createScaledBitmap(b0, 64, 64, true)
                  val px = IntArray(4096)
                  b.getPixels(px, 0, 64, 0, 0, 64, 64)
                  val g = FloatArray(4096)
                  var mn = 255f
                  var mx = 0f
                  for (i in 0 until 4096) {
                      val p = px[i]
                      val al = Color.alpha(p) / 255f
                      val r = Color.red(p) * al + 255f * (1f - al)
                      val gg = Color.green(p) * al + 255f * (1f - al)
                      val bb = Color.blue(p) * al + 255f * (1f - al)
                      val v = 0.299f * r + 0.587f * gg + 0.114f * bb
                      g[i] = v
                      if (v < mn) mn = v
                      if (v > mx) mx = v
                  }
                  if (skipFlat && mx - mn < 12f) return null
                  val blk = FloatArray(64)
                  var sum = 0f
                  for (by in 0 until 8) for (bx in 0 until 8) {
                      var s = 0f
                      for (yy in 0 until 8) for (xx in 0 until 8) s += g[(by * 8 + yy) * 64 + bx * 8 + xx]
                      blk[by * 8 + bx] = s / 64f
                      sum += s / 64f
                  }
                  val mean = sum / 64f
                  var a = 0L
                  for (i in 0 until 64) if (blk[i] > mean) a = a or (1L shl i)
                  val gr = FloatArray(72)
                  for (r in 0 until 8) for (c in 0 until 9) {
                      val x0 = c * 64 / 9
                      val x1 = maxOf(x0 + 1, (c + 1) * 64 / 9)
                      var s = 0f
                      var n = 0
                      for (yy in r * 8 until r * 8 + 8) for (xx in x0 until x1) {
                          s += g[yy * 64 + xx]
                          n++
                      }
                      gr[r * 9 + c] = s / n
                  }
                  var d = 0L
                  var k = 0
                  for (r in 0 until 8) for (c in 0 until 8) {
                      if (gr[r * 9 + c] > gr[r * 9 + c + 1]) d = d or (1L shl k)
                      k++
                  }
                  return Fp(a, d)
              }

              private fun imgFp(m: Item): Fp? {
                  var bmp: Bitmap? = null
                  try {
                      bmp = ImageDecoder.decodeBitmap(ImageDecoder.createSource(contentResolver, m.uri)) { dec, info, _ ->
                          if (m.w <= 0) { m.w = info.size.width; m.h = info.size.height }
                          dec.setTargetSize(64, 64)
                          dec.allocator = ImageDecoder.ALLOCATOR_SOFTWARE
                      }
                  } catch (e: Throwable) {}
                  if (bmp == null) {
                      try {
                          val o = BitmapFactory.Options()
                          o.inSampleSize = 8
                          val ins = contentResolver.openInputStream(m.uri)
                          if (ins != null) ins.use { s -> bmp = BitmapFactory.decodeStream(s, null, o) }
                      } catch (e: Throwable) {}
                  }
                  val b = bmp
                  if (b == null) { m.bad = true; return null }
                  return hashBmp(b, true)
              }

              private fun vidFrames(m: Item, step: Int, turbo: Boolean, onFrame: () -> Unit): List<Fp?>? {
                  val mr = MediaMetadataRetriever()
                  try {
                      mr.setDataSource(this, m.uri)
                      val n = Math.ceil(m.dur / 1000.0 / step).toInt()
                      val res = ArrayList<Fp?>()
                      for (k in 0 until n) {
                          if (cancel) return null
                          val t = minOf(m.dur * 1000L - 100000L, ((step / 2.0 + k * step) * 1000000.0).toLong())
                          val opt = if (turbo) MediaMetadataRetriever.OPTION_CLOSEST_SYNC else MediaMetadataRetriever.OPTION_CLOSEST
                          val bmp = mr.getScaledFrameAtTime(maxOf(0L, t), opt, 64, 64)
                          res.add(if (bmp == null) null else hashBmp(bmp, true))
                          onFrame()
                      }
                      return res
                  } catch (e: Throwable) {
                      return null
                  } finally {
                      try { mr.release() } catch (e: Throwable) {}
                  }
              }

              private fun fm(x: Fp?, y: Fp?, t: Int): Boolean {
                  if (x == null || y == null) return false
                  return java.lang.Long.bitCount(x.d xor y.d) <= t + 4 && java.lang.Long.bitCount(x.a xor y.a) <= t + 8
              }

              private fun sharedRun(A: List<Fp?>, B: List<Fp?>, t: Int): Run {
                  var best = Run(0, 0, 0, 0, 0)
                  for (off in -(B.size - 1) until A.size) {
                      var cnt = 0
                      var gap = 0
                      var st = 0
                      var i = maxOf(0, off)
                      while (i < A.size) {
                          val j = i - off
                          if (j >= B.size) break
                          if (fm(A[i], B[j], t)) {
                              if (cnt == 0) st = i
                              cnt++
                              gap = 0
                              if (cnt > best.n) best = Run(cnt, st, i, st - off, i - off)
                          } else {
                              gap++
                              if (gap > 1) { cnt = 0; gap = 0 }
                          }
                          i++
                      }
                  }
                  return best
              }

              private fun findExact(items: List<Item>): List<List<Item>> {
                  val bySize = HashMap<Long, MutableList<Item>>()
                  for (m in items) if (m.size > 0) bySize.getOrPut(m.size) { ArrayList() }.add(m)
                  val cand = ArrayList<Item>()
                  for (g in bySize.values) if (g.size > 1) cand.addAll(g)
                  val done = AtomicInteger(0)
                  val t0 = System.currentTimeMillis()
                  par(cand, 6) { m ->
                      val k = if (useCache) ck(m) else null
                      val hit = if (k != null) shaCache[k] else null
                      if (hit != null) {
                          m.sha = hit
                      } else {
                          m.sha = sha(m.uri)
                          val h = m.sha
                          if (k != null && h != null) newSha[k] = h
                      }
                      val d = done.incrementAndGet()
                      if (d % 3 == 0) prog(d, cand.size, "Checking exact copies... $d/" + cand.size + eta(d, cand.size, t0))
                  }
                  val byHash = HashMap<String, MutableList<Item>>()
                  for (m in cand) {
                      val h = m.sha
                      if (h != null) byHash.getOrPut(h + ":" + m.size) { ArrayList() }.add(m)
                  }
                  val res = ArrayList<List<Item>>()
                  for (g in byHash.values) if (g.size > 1) res.add(g)
                  return res
              }

              private fun sameShape(a: Item, b: Item): Boolean {
                  if (a.w <= 0 || a.h <= 0 || b.w <= 0 || b.h <= 0) return true
                  val ra = maxOf(a.w, a.h).toDouble() / minOf(a.w, a.h)
                  val rb = maxOf(b.w, b.h).toDouble() / minOf(b.w, b.h)
                  return Math.abs(ra - rb) / maxOf(ra, rb) <= 0.05
              }

              private fun scanPhotos(items: List<Item>, out: ArrayList<Group>) {
                  val ex = findExact(items)
                  val twins = HashMap<Item, List<Item>>()
                  val skip = HashSet<Item>()
                  for (g in ex) {
                      twins[g[0]] = g
                      for (i in 1 until g.size) skip.add(g[i])
                  }
                  val inNear = HashSet<Item>()
                  if (!cancel && !prefs.getBoolean("exact", false)) {
                      val reps = items.filter { it !in skip }
                      val n = AtomicInteger(0)
                      val t0 = System.currentTimeMillis()
                      par(reps, 8) { m ->
                          val k = if (useCache) ck(m) else null
                          val hit = if (k != null) fpCache[k] else null
                          if (hit != null) {
                              m.fp = if (hit[2] == 1L) null else Fp(hit[0], hit[1])
                          } else {
                              m.fp = imgFp(m)
                              val f = m.fp
                              if (k != null && !m.bad) newFp[k] = longArrayOf(f?.a ?: 0L, f?.d ?: 0L, if (f == null) 1L else 0L)
                          }
                          val d = n.incrementAndGet()
                          if (d % 25 == 0) prog(d, reps.size, "Comparing photos... $d/" + reps.size + eta(d, reps.size, t0))
                      }
                      if (cancel) return
                      prog(0, 1, "Matching look-alikes...")
                      val t = prefs.getInt("sens", 5)
                      val kc = t + 1
                      fun chunk(d: Long, c: Int): Long {
                          val lo = c * 64 / kc
                          val hi = (c + 1) * 64 / kc
                          return (d ushr lo) and ((1L shl (hi - lo)) - 1L)
                      }
                      val maps = ArrayList<HashMap<Long, ArrayList<Int>>>()
                      for (c in 0 until kc) maps.add(HashMap())
                      for (i in reps.indices) {
                          val f = reps[i].fp ?: continue
                          for (c in 0 until kc) maps[c].getOrPut(chunk(f.d, c)) { ArrayList() }.add(i)
                      }
                      val taken = BooleanArray(reps.size)
                      val stamp = IntArray(reps.size)
                      for (i in reps.indices) {
                          if (cancel) return
                          val a = reps[i]
                          val fa = a.fp
                          if (fa == null || taken[i]) continue
                          val hits = ArrayList<Int>()
                          for (c in 0 until kc) {
                              val lst = maps[c][chunk(fa.d, c)] ?: continue
                              for (j in lst) {
                                  if (j > i && !taken[j] && stamp[j] != i + 1) {
                                      stamp[j] = i + 1
                                      hits.add(j)
                                  }
                              }
                          }
                          hits.sort()
                          val g = ArrayList<Item>()
                          g.add(a)
                          val mem = ArrayList<Int>()
                          for (j in hits) {
                              val b = reps[j]
                              val fb = b.fp ?: continue
                              if (sameShape(a, b) && java.lang.Long.bitCount(fa.d xor fb.d) <= t && java.lang.Long.bitCount(fa.a xor fb.a) <= t + 4) {
                                  g.add(b)
                                  mem.add(j)
                              }
                          }
                          if (g.size > 1) {
                              taken[i] = true
                              for (j in mem) taken[j] = true
                              val full = ArrayList<Item>()
                              for (m in g) full.addAll(twins[m] ?: listOf(m))
                              inNear.addAll(full)
                              out.add(Group("Look-alike", full, "", true))
                          }
                      }
                  }
                  for (g in ex) if (g[0] !in inNear) out.add(Group("Exact copy", g, "", true))
              }

              private fun scanVideos(items: List<Item>, out: ArrayList<Group>) {
                  val ex = findExact(items)
                  for (g in ex) out.add(Group("Exact copy", g, "", true))
                  if (cancel || prefs.getBoolean("exact", false) || !prefs.getBoolean("shared", false)) return
                  val skip = HashSet<Item>()
                  for (g in ex) for (i in 1 until g.size) skip.add(g[i])
                  val reps = items.filter { it !in skip && it.dur > 3000 }
                  if (reps.size < 2) return
                  var md = 0L
                  for (m in reps) if (m.dur > md) md = m.dur
                  val turbo = prefs.getInt("vmode", 0) == 0
                  val step = maxOf(prefs.getInt("vstep", 2), Math.ceil(md / 1000.0 / 300.0).toInt())
                  var totalF = 0
                  for (m in reps) totalF += Math.ceil(m.dur / 1000.0 / step).toInt()
                  val tf = totalF
                  val done = AtomicInteger(0)
                  val t0 = System.currentTimeMillis()
                  par(reps, 6) { m ->
                      val k = if (useCache) ck(m) else null
                      val kk = if (k != null) k + "|" + step + "|" + (if (turbo) 1 else 0) else null
                      var got: List<Fp?>? = null
                      if (kk != null) {
                          try { got = cache.loadVf(kk) } catch (e: Throwable) {}
                      }
                      if (got != null) {
                          m.fr = got
                          val d = done.addAndGet(got.size)
                          prog(d, tf, "Reading video frames... $d/$tf")
                      } else {
                          val fr = vidFrames(m, step, turbo) {
                              val d = done.incrementAndGet()
                              if (d % 4 == 0) prog(d, tf, "Reading video frames... $d/$tf" + eta(d, tf, t0))
                          }
                          m.fr = fr
                          if (fr != null && kk != null) {
                              try { cache.saveVf(kk, fr) } catch (e: Throwable) {}
                          }
                      }
                  }
                  if (cancel) return
                  val ok = reps.filter { m -> (m.fr?.count { f -> f != null } ?: 0) >= 3 }
                  prog(0, 1, "Comparing " + ok.size + " videos...")
                  val t = prefs.getInt("sens", 5) + (if (turbo) 2 else 0)
                  val hits = java.util.Collections.synchronizedList(ArrayList<Group>())
                  val idx = ArrayList<Int>()
                  for (i in ok.indices) idx.add(i)
                  par(idx, 16) { i ->
                      for (j in i + 1 until ok.size) {
                          var a = ok[i]
                          var b = ok[j]
                          if (b.dur > a.dur) { val x = a; a = b; b = x }
                          val r = sharedRun(a.fr!!, b.fr!!, t)
                          val need = maxOf(3, Math.ceil(minOf(20.0, 0.6 * b.dur / 1000.0) / step).toInt())
                          if (r.n >= need) {
                              val e1 = minOf(a.dur / 1000.0, (r.a1 + 1) * step.toDouble())
                              val e2 = minOf(b.dur / 1000.0, (r.b1 + 1) * step.toDouble())
                              val len = minOf(e1 - r.a0 * step, e2 - r.b0 * step)
                              val note = "Matching footage about " + mmss(len) + ". Longer video " + mmss(r.a0 * step.toDouble()) + "-" + mmss(e1) +
                                  ", shorter video " + mmss(r.b0 * step.toDouble()) + "-" + mmss(e2) + ". Check before trashing."
                              hits.add(Group("Shared footage", listOf(a, b), note, false))
                          }
                      }
                  }
                  out.addAll(hits)
              }

              private fun mmss(s: Double): String {
                  val t = s.toInt()
                  return String.format("%d:%02d", t / 60, t % 60)
              }
          }
          EOF

      - name: Build APK
        run: gradle --no-daemon assembleDebug
      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Twinly.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "build-${{ github.run_number }}" Twinly.apk --title "Twinly build ${{ github.run_number }}" --notes "Twinly debug APK"
