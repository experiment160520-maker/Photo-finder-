                  else window.clearFlags(WindowManager.LayoutParams.FLAG_SECURE)
                  val y = if (keep) (sv?.scrollY ?: 0) else 0
                  grads.clear()
                  gbar = null
                  trashBtn = null
                  statusTv = null
                  updSel = null
                  val s = ScrollView(this)
